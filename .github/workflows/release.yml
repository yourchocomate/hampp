name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Select the Android NDK (r29)
        run: echo "ANDROID_NDK_BIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Termux packages use xz for both deb members; nFPM cannot produce that.
      - name: Build the Termux .deb packages
        run: |
          VER="${GITHUB_REF_NAME#v}"
          for pair in arm64:aarch64 arm:arm amd64:x86_64 386:i686; do
            goarch="${pair%%:*}"; termux="${pair##*:}"
            bin=$(ls -d dist/hampp_android_${goarch}*/hampp | head -1)
            bash scripts/build-termux-deb.sh "$bin" "$termux" "$VER" "dist/hampp_${VER}_${termux}.termux.deb"
          done

      - name: Refresh checksums and attach the packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum hampp_*.tar.gz hampp_*.termux.deb > checksums.txt
          gh release upload "$GITHUB_REF_NAME" hampp_*.termux.deb checksums.txt --clobber
